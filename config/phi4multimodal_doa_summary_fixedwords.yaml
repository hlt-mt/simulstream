type: "simulstream.server.speech_processors.phi4multimodal_doa.Phi4MultimodalDOA"
text_history:
  type: "simulstream.server.speech_processors.base_doa.SummaryFixedWordsTextHistory"
  history_words: __HISTORY__
  summary_max_new_tokens: 64
audio_history_max_duration: 180  # Maximum length for the audio buffer, in seconds
text_history_max_len: 128
speech_chunk_size: 1  # seconds
attn_layer: __LAYER__
cutoff_frame_num: __FRAME__
average_attn_over_layers: True
detokenizer_type: "hf"
hf_model_name: "microsoft/Phi-4-multimodal-instruct"
word_level_postprocess: True  # Disable if character-level language
max_new_tokens: 32